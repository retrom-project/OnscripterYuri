name: RPG Runtime Quality

on:
  pull_request:
    branches: ["retrom/0.7.7beta"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rpg-runtime-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate fork source contract
        run: python3 .github/rpg-runtime/verify-source.py
      - name: Build Web assets
        run: .github/rpg-runtime/build-web.sh "$RUNNER_TEMP/rpg-runtime-output"
      - name: Validate candidate assets
        run: |
          python3 .github/rpg-runtime/verify-release.py \
            --output "$RUNNER_TEMP/rpg-runtime-output" \
            --repository "https://github.com/$GITHUB_REPOSITORY" \
            --tag retrom-core-0.7.7beta-r1-rc.1 \
            --commit "$GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Prepare pinned browser tests
        run: |
          npm install --prefix "$RUNNER_TEMP/ons-browser" --no-audit --no-fund playwright@1.61.1
          "$RUNNER_TEMP/ons-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify current wait checkpoints and native slots
        run: |
          browser=$(node -e "process.stdout.write(require(process.argv[1]).chromium.executablePath())" "$RUNNER_TEMP/ons-browser/node_modules/playwright")
          node .github/rpg-runtime/checkpoint-browser.mjs \
            "$RUNNER_TEMP/rpg-runtime-output" \
            /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf \
            "$RUNNER_TEMP/ons-browser/node_modules/playwright/index.mjs" \
            "$browser" "$RUNNER_TEMP/ons-checkpoint-default"
          ONS_TEXTGOSUB=1 node .github/rpg-runtime/checkpoint-browser.mjs \
            "$RUNNER_TEMP/rpg-runtime-output" \
            /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf \
            "$RUNNER_TEMP/ons-browser/node_modules/playwright/index.mjs" \
            "$browser" "$RUNNER_TEMP/ons-checkpoint-textgosub"
      - name: Upload checkpoint browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ons-checkpoint-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ons-checkpoint-default
            ${{ runner.temp }}/ons-checkpoint-textgosub
          if-no-files-found: warn
          retention-days: 7
      - name: Upload branch integration candidate
        uses: actions/upload-artifact@v4
        with:
          name: rpg-runtime-ons-${{ github.sha }}
          path: |
            ${{ runner.temp }}/rpg-runtime-output/onsyuri.js
            ${{ runner.temp }}/rpg-runtime-output/onsyuri.wasm
            ${{ runner.temp }}/rpg-runtime-output/COPYING
            ${{ runner.temp }}/rpg-runtime-output/rpg-runtime-release.json
          if-no-files-found: error
          retention-days: 7
