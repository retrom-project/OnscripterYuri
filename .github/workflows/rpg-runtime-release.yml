name: RPG Runtime Release

on:
  push:
    tags: ["rpg-runtime-0.7.7beta-r*"]

permissions:
  contents: write

concurrency:
  group: rpg-runtime-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release identity
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^rpg-runtime-0\.7\.7beta-r[1-9][0-9]*$ ]]
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin \
            '+refs/heads/retrom/0.7.7beta:refs/remotes/origin/retrom/0.7.7beta'
          git merge-base --is-ancestor "$GITHUB_SHA" origin/retrom/0.7.7beta
          git merge-base --is-ancestor 08f744b31cc1907b66a15f0402e62321a131ed81 "$GITHUB_SHA"
          test -z "$(git rev-list --min-parents=2 08f744b31cc1907b66a15f0402e62321a131ed81.."$GITHUB_SHA")"
          python3 .github/rpg-runtime/verify-source.py
      - name: Build Web assets
        run: .github/rpg-runtime/build-web.sh "$RUNNER_TEMP/rpg-runtime-output"
      - name: Validate and describe assets
        run: |
          python3 .github/rpg-runtime/verify-release.py \
            --output "$RUNNER_TEMP/rpg-runtime-output" \
            --repository "https://github.com/$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA"
      - name: Create immutable-tag release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag --target "$GITHUB_SHA" \
            --title "ONScripterYuri Web $GITHUB_REF_NAME" --generate-notes \
            "$RUNNER_TEMP/rpg-runtime-output/onsyuri.js" \
            "$RUNNER_TEMP/rpg-runtime-output/onsyuri.wasm" \
            "$RUNNER_TEMP/rpg-runtime-output/COPYING" \
            "$RUNNER_TEMP/rpg-runtime-output/rpg-runtime-release.json"
